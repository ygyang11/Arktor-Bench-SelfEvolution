[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arktor-bench"
version = "0.1.0"
description = "Evaluate an agent harness: run one model through different harnesses, score task completion neutrally, diagnose harness vs. model failures, and self evolve the harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Arktor-Bench-SelfEvolution contributors" }]
keywords = ["agent", "harness", "benchmark", "evaluation", "self-evolution", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "openai>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "tiktoken>=0.7,<1.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "docker>=7.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
arktor-bench = "arktor_bench.cli:app"

[project.urls]
Repository = "https://github.com/ygyang11/Arktor-Bench-SelfEvolution"
Issues = "https://github.com/ygyang11/Arktor-Bench-SelfEvolution/issues"

[tool.setuptools.packages.find]
include = ["arktor_bench*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["arktor_bench"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "F401", "F811"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "llm: needs a real LLM API (gated behind --run-llm)",
    "docker: needs a Docker daemon and the built bench image (gated behind --run-docker)",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tqdm.*", "tiktoken.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true
follow_imports = "skip"
